name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        run: npx playwright test
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: battleship-game:ci
      - name: Smoke test the image
        run: |
          docker run -d --name bs -p 8080:8080 battleship-game:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS localhost:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = 1 ] && curl -fsS localhost:8080/ | grep -q '<div\|<main'; then
            echo "smoke test passed: /healthz is 200 and index.html is served"
            exit 0
          fi
          docker logs bs
          exit 1
